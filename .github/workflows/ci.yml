name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        toolchain: [stable, '1.85.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        run: rustup toolchain install '${{ matrix.toolchain }}' --profile minimal --component rustfmt,clippy
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --all --check
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests and doctests
        run: cargo +${{ matrix.toolchain }} test --locked
      - name: Sync guard tests
        if: matrix.toolchain == 'stable'
        run: python3 -m unittest discover -s scripts -v
