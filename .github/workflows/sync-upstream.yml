name: Sync upstream data

on:
  schedule:
    # Daily at 08:23 UTC, after upstream's scheduled update.
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-data
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Check upstream source and download gzip data
        run: python3 scripts/sync_upstream.py sync
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # GITHUB_TOKEN pushes do not trigger CI, so validate here before committing.
      - name: Validate updated dataset and sync guard
        run: |
          cargo +stable test --locked
          python3 -m unittest discover -s scripts -v
      - name: Commit data update
        run: |
          if git diff --quiet -- data/user-agents.json.gz data/upstream.json; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/user-agents.json.gz data/upstream.json
          git commit -m 'chore(data): sync upstream user agents'
          git push origin HEAD:main
